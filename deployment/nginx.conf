# /etc/nginx/sites-available/prompt-exchange
# Symlink to sites-enabled: ln -s /etc/nginx/sites-available/prompt-exchange /etc/nginx/sites-enabled/

upstream prompt_exchange {
    server unix:/run/prompt-exchange/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name eax.sciencecloud.nasa.gov;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name eax.sciencecloud.nasa.gov;

    # SSL — update paths to match your certificate locations
    ssl_certificate     /etc/ssl/certs/eax.sciencecloud.nasa.gov.crt;
    ssl_certificate_key /etc/ssl/private/eax.sciencecloud.nasa.gov.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Static files served directly by nginx
    location /prompt-exchange/static/ {
        alias /srv/prompt-exchange/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files served directly by nginx
    location /prompt-exchange/media/ {
        alias /srv/prompt-exchange/media/;
    }

    # Application — strip the /prompt-exchange prefix before forwarding to gunicorn.
    # Django knows about the prefix via FORCE_SCRIPT_NAME in settings and uses it
    # when generating all reversed URLs (including allauth OAuth callbacks).
    location /prompt-exchange {
        rewrite ^/prompt-exchange/?(.*)$ /$1 break;

        proxy_pass http://prompt_exchange;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_buffering off;
    }
}
