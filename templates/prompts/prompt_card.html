<div class="card h-100 prompt-card">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="badge bg-primary">{{ prompt.domain.name }}</span>
            <small class="text-muted">
                <button class="btn btn-sm btn-link p-0 text-decoration-none upvote-btn {% if user.is_authenticated and user in prompt.upvotes.all %}active{% endif %}"
                        data-slug="{{ prompt.slug }}"
                        {% if not user.is_authenticated %}disabled{% endif %}>
                    <i class="bi bi-hand-thumbs-up{% if user.is_authenticated and user in prompt.upvotes.all %}-fill{% endif %}"></i>
                    <span class="upvote-count">{{ prompt.upvote_count }}</span>
                </button>
            </small>
        </div>
        <h5 class="card-title">
            <a href="{% url 'prompt_detail' prompt.slug %}" class="text-decoration-none text-dark">
                {{ prompt.title }}
            </a>
        </h5>
        <p class="card-text text-muted small">{{ prompt.description|truncatewords:20 }}</p>
        <div class="d-flex justify-content-between align-items-center mt-3">
            <small class="text-muted">
                <i class="bi bi-person"></i> {{ prompt.author.get_full_name|default:prompt.author.username }}
            </small>
            <small class="text-muted">{{ prompt.created_at|date:"M d, Y" }}</small>
        </div>
        {% if prompt.get_tags_list %}
        <div class="mt-2">
            {% for tag in prompt.get_tags_list %}
            <span class="badge bg-secondary me-1">{{ tag }}</span>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</div>
